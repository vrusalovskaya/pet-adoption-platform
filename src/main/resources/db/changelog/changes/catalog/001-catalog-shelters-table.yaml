databaseChangeLog:

  - changeSet:
      id: 001-catalog-shelters-table
      author: victoria

      changes:

        - createTable:
            schemaName: catalog
            tableName: shelters

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: city
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(255)

              - column:
                  name: contact_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: contact_phone
                  type: VARCHAR(20)

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false