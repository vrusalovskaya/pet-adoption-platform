databaseChangeLog:

  - changeSet:
      id: 002-catalog-animals-table
      author: victoria

      changes:

        - createTable:
            schemaName: catalog
            tableName: animals

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: shelter_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: species
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: breed
                  type: VARCHAR(50)

              - column:
                  name: birth_year
                  type: INTEGER

              - column:
                  name: gender
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: AVAILABLE
                  constraints:
                    nullable: false

              - column:
                  name: photo_file_id
                  type: VARCHAR(255)

              - column:
                  name: photo_filename
                  type: VARCHAR(255)

              - column:
                  name: photo_content_type
                  type: VARCHAR(255)

              - column:
                  name: storage_type
                  type: VARCHAR(20)

              - column:
                  name: size_bytes
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            schemaName: catalog
            tableName: animals
            indexName: idx_animals_shelter_status

            columns:
              - column:
                  name: shelter_id

              - column:
                  name: status

        - sql:
            sql: |
              ALTER TABLE catalog.animals
              ADD CONSTRAINT fk_animals_shelter
              FOREIGN KEY (shelter_id)
              REFERENCES catalog.shelters(id);