databaseChangeLog:

  - changeSet:
      id: 001-adoption-applications-table
      author: victoria

      changes:

        - createTable:
            schemaName: adoption
            tableName: adoption_applications

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: animal_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: applicant_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: decision_comment
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            schemaName: adoption
            tableName: adoption_applications
            indexName: idx_adoption_applications_animal_id

            columns:
              - column:
                  name: animal_id

        - createIndex:
            schemaName: adoption
            tableName: adoption_applications
            indexName: idx_adoption_applications_applicant_id

            columns:
              - column:
                  name: applicant_id