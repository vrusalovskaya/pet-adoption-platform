spring.application.name=pet-adoption-test
spring.datasource.url=jdbc:postgresql://localhost:5432/placeholder
spring.datasource.username=test
spring.datasource.password=test
storage.type=minio
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=animals
spring.data.mongodb.uri=mongodb://localhost:27017/test
spring.data.mongodb.auto-index-creation=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.test.database.replace=none
logging.level.org.springframework.security=WARN
logging.level.liquibase=WARN
security.jwt.secret=very-strong-secret-key-should-be-at-least-32-bytes
security.jwt.access-token-ttl=15m
security.refresh-token.ttl=30d